name: Install
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  install:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install notarized app into Applications and uninstall cleanly
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
          HOMEBREW_NO_INSTALL_CLEANUP: '1'
        run: |
          brew tap-new limitwen/ci
          mkdir -p "$(brew --repository)/Library/Taps/limitwen/homebrew-ci/Casks"
          cp Casks/limitwen.rb "$(brew --repository)/Library/Taps/limitwen/homebrew-ci/Casks/limitwen.rb"
          appdir="$RUNNER_TEMP/Applications"
          brew install --cask limitwen/ci/limitwen --appdir="$appdir"
          python3 scripts/check-cask.py limitwen/ci/limitwen
          test -x "$appdir/Limitwen.app/Contents/MacOS/Limitwen"
          codesign --verify --deep --strict "$appdir/Limitwen.app"
          xcrun stapler validate "$appdir/Limitwen.app"
          spctl --assess --type execute --verbose=2 "$appdir/Limitwen.app"
          brew uninstall --cask limitwen/ci/limitwen
          test ! -e "$appdir/Limitwen.app"
